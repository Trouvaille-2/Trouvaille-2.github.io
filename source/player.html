<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent}
.aplayer{border-radius:12px!important;box-shadow:0 2px 12px rgba(0,0,0,.12)!important}
.aplayer .aplayer-list{max-height:300px!important}
@media(prefers-color-scheme:dark){
  .aplayer{background:rgba(30,30,30,.95)!important}
  .aplayer .aplayer-title,.aplayer .aplayer-list ol li{color:#eee!important}
  .aplayer .aplayer-author{color:#aaa!important}
}
</style>
</head>
<body>
<div class="aplayer" data-id="9516678957" data-server="netease" data-type="playlist" data-autoplay="false" data-mutex="true" data-theme="#ad7a86" data-preload="auto" data-order="random" data-listmaxheight="240px" data-volume="0.7" data-listfolded="true"></div>
<script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>
</body>
</html>
